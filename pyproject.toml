[project]
name = "predictive-maintenance-platform"
version = "0.1.0"
description = "Industrial Predictive Maintenance Platform — AI4I 2020 dataset"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35.0",
    "pandas>=2.2.3",
    "pyarrow>=17.0.0",
    "pandera>=0.20.0",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.30.0",
    "numpy>=1.26.4",
    "scikit-learn>=1.5.2",
    "xgboost>=2.1.1",
    "mlflow>=2.16.0",
    "matplotlib>=3.9.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "pydantic>=2.9.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.12.0",
]

[tool.ruff]
line-length = 100
exclude = ["dashboard/", ".venv/", "node_modules/", "src/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
